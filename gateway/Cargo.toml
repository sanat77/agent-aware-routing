[package]
name = "inference-gateway"
version = "0.1.0"
edition = "2021"
description = "Agent-aware routing gateway in front of llama.cpp llama-server"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
bytes = "1"

[dev-dependencies]

[profile.release]
debug = 1
